spring.application.name=vehicle-service
server.port=8081


spring.datasource.url=${VEHICLE_DB_URL:jdbc:postgresql://localhost:5432/vehicles}
spring.datasource.username=${VEHICLE_DB_USER:postgres}
spring.datasource.password=${VEHICLE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update


spring.config.import=optional:file:./local.properties